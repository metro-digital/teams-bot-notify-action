name: 'Teams Bot Message'
description: 'Send proactive message to Microsoft Teams via Azure Bot Framework'
inputs:
  tenant-id:
    description: 'Azure Tenant ID'
    required: true
  client-id:
    description: 'Azure Client ID (App ID)'
    required: true
  channel-id:
    description: 'Teams Channel ID'
    required: true
  message:
    description: 'Message text to send'
    required: true
  as-card:
    description: 'Wraps the plain message text inside a single Adaptive Card TextBlock. It does not support buttons, facts, columns, images, or multiple text blocks — it changes how the message renders (card vs. plain text), not its structure.'
    required: false
    default: 'false'
runs:
  using: 'node20'
  main: 'dist/index.js'
